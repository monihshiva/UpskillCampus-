<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshBite - Online Food Ordering</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>FreshBite</h1><nav><a href="#home">Home</a><a href="#menu">Menu</a><a href="#cart">Cart (<span id="cartCount">0</span>)</a></nav></header>
<main>
<section id="home" class="hero"><h2>Order Your Favourite Food</h2><p>Fresh food, simple ordering and quick service.</p><a class="btn" href="#menu">View Menu</a></section>
<section id="menu"><h2>Food Menu</h2><div class="food-grid" id="foodList"></div></section>
<section id="cart"><h2>Your Cart</h2><div id="cartItems"></div><div class="summary"><strong>Total: ₹<span id="cartTotal">0</span></strong><button onclick="placeOrder()">Place Order</button></div></section>
</main>
<footer><p>© 2026 FreshBite - Online Food Ordering Project</p></footer>
<script src="script.js"></script>
</body>
</html>
